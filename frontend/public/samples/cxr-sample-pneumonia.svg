<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background & Thorax gradient -->
    <radialGradient id="thoraxBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#121417" />
      <stop offset="65%" stop-color="#08090a" />
      <stop offset="100%" stop-color="#020304" />
    </radialGradient>

    <!-- Lung transparency -->
    <radialGradient id="lungField" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#030303" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#0d0e12" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1e2025" stop-opacity="0.85" />
    </radialGradient>

    <!-- Bone opacity -->
    <linearGradient id="boneGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25" />
    </linearGradient>

    <!-- Heart shadow -->
    <radialGradient id="heartSilhouette" cx="45%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#e0e4ec" stop-opacity="0.75" />
      <stop offset="60%" stop-color="#a4abb8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#3c414c" stop-opacity="0.2" />
    </radialGradient>

    <!-- Mediastinum & spine -->
    <linearGradient id="spineCol" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2" />
    </linearGradient>

    <!-- Focal Opacity Infiltrate (Right lower/mid zone) -->
    <radialGradient id="focalInfiltrate" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#e8ecf4" stop-opacity="0.65" />
      <stop offset="70%" stop-color="#a2abbd" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#3a404c" stop-opacity="0" />
    </radialGradient>

    <!-- Bronchovascular tree pattern -->
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>

  <!-- Deep black background canvas -->
  <rect width="1024" height="1024" fill="#000000" />
  
  <!-- Outer Thoracic Soft Tissue Outline -->
  <path d="M 280,110 C 180,240 120,440 110,720 C 105,820 180,950 320,980 L 704,980 C 844,950 919,820 914,720 C 904,440 844,240 744,110 Z" fill="url(#thoraxBg)" />

  <!-- Thoracic spine (central column) -->
  <rect x="496" y="90" width="32" height="780" fill="url(#spineCol)" rx="6" />
  <!-- Vertebral bodies -->
  <g opacity="0.3" fill="#ffffff">
    <rect x="490" y="140" width="44" height="24" rx="3" />
    <rect x="488" y="180" width="48" height="28" rx="3" />
    <rect x="486" y="225" width="52" height="30" rx="3" />
    <rect x="484" y="275" width="56" height="34" rx="4" />
    <rect x="482" y="330" width="60" height="38" rx="4" />
    <rect x="480" y="390" width="64" height="42" rx="4" />
    <rect x="478" y="455" width="68" height="46" rx="4" />
    <rect x="476" y="525" width="72" height="50" rx="4" />
    <rect x="474" y="600" width="76" height="54" rx="5" />
    <rect x="472" y="680" width="80" height="58" rx="5" />
    <rect x="470" y="765" width="84" height="62" rx="5" />
  </g>

  <!-- Clavicles -->
  <path d="M 500,165 C 410,150 310,135 220,175 C 205,182 208,198 225,195 C 310,165 410,175 495,185 Z" fill="url(#boneGrad)" />
  <path d="M 524,165 C 614,150 714,135 804,175 C 819,182 816,198 799,195 C 714,165 614,175 529,185 Z" fill="url(#boneGrad)" />

  <!-- Left Lung Field (Anatomical Right on image: left side of canvas 180..490) -->
  <path d="M 470,190 C 370,185 240,240 200,380 C 160,520 165,700 180,820 C 220,845 320,835 440,770 C 470,720 480,550 475,340 Z" fill="url(#lungField)" />

  <!-- Right Lung Field (Anatomical Left on image: right side of canvas 534..844) -->
  <path d="M 554,190 C 654,185 784,240 824,380 C 864,520 859,700 844,820 C 804,850 704,845 600,795 C 570,730 550,550 549,340 Z" fill="url(#lungField)" />

  <!-- Posterior Ribs (Curved radiopaque bands) -->
  <g stroke="#ffffff" stroke-width="14" fill="none" opacity="0.32" stroke-linecap="round" filter="url(#blurFilter)">
    <!-- Pair 1 -->
    <path d="M 480,210 C 360,200 240,250 200,310" />
    <path d="M 544,210 C 664,200 784,250 824,310" />
    <!-- Pair 2 -->
    <path d="M 480,270 C 340,260 210,320 180,390" />
    <path d="M 544,270 C 684,260 814,320 844,390" />
    <!-- Pair 3 -->
    <path d="M 480,340 C 320,330 190,400 170,490" />
    <path d="M 544,340 C 704,330 834,400 854,490" />
    <!-- Pair 4 -->
    <path d="M 480,420 C 300,410 180,490 165,600" />
    <path d="M 544,420 C 724,410 844,490 859,600" />
    <!-- Pair 5 -->
    <path d="M 480,510 C 290,500 175,590 165,710" />
    <path d="M 544,510 C 734,500 849,590 859,710" />
    <!-- Pair 6 -->
    <path d="M 480,610 C 290,600 185,700 175,810" />
    <path d="M 544,610 C 734,600 839,700 849,810" />
  </g>

  <!-- Anterior Ribs (Down & inward) -->
  <g stroke="#ffffff" stroke-width="9" fill="none" opacity="0.22" stroke-linecap="round">
    <path d="M 210,320 C 280,360 380,410 460,450" />
    <path d="M 814,320 C 744,360 644,410 564,450" />
    <path d="M 190,400 C 270,460 380,520 460,560" />
    <path d="M 834,400 C 754,460 644,520 564,560" />
    <path d="M 175,500 C 265,570 380,630 455,680" />
    <path d="M 849,500 C 759,570 644,630 569,680" />
  </g>

  <!-- Cardiac Silhouette & Mediastinum -->
  <path d="M 490,260 C 470,360 460,460 430,550 C 400,640 370,720 420,770 C 470,810 570,820 620,770 C 670,720 650,620 610,510 C 570,410 550,330 534,260 Z" fill="url(#heartSilhouette)" filter="url(#softGlow)" />

  <!-- Diaphragm Domes -->
  <!-- Right hemidiaphragm (higher) -->
  <path d="M 150,850 C 240,760 380,750 480,800 C 470,860 400,900 150,910 Z" fill="#b0b8c6" opacity="0.55" filter="url(#blurFilter)" />
  <!-- Left hemidiaphragm (under heart) -->
  <path d="M 520,810 C 620,770 760,780 860,860 C 840,920 650,920 520,890 Z" fill="#9ba5b5" opacity="0.5" filter="url(#blurFilter)" />

  <!-- Bronchovascular hilar markings (tree) -->
  <g stroke="#ffffff" opacity="0.25" stroke-linecap="round" filter="url(#blurFilter)">
    <line x1="460" y1="420" x2="380" y2="470" stroke-width="8" />
    <line x1="380" y1="470" x2="310" y2="520" stroke-width="5" />
    <line x1="380" y1="470" x2="330" y2="430" stroke-width="4" />
    <line x1="310" y1="520" x2="260" y2="570" stroke-width="3" />
    
    <line x1="564" y1="420" x2="644" y2="480" stroke-width="7" />
    <line x1="644" y1="480" x2="724" y2="540" stroke-width="5" />
    <line x1="644" y1="480" x2="694" y2="440" stroke-width="4" />
  </g>

  <!-- PNEUMONIA FOCAL OPACITY (ROI around [412, 508, 701, 872]) -->
  <!-- Radiographic alveolar consolidation in Right Lower/Middle zone -->
  <g filter="url(#softGlow)">
    <ellipse cx="550" cy="680" rx="130" ry="160" fill="url(#focalInfiltrate)" opacity="0.88" />
    <circle cx="580" cy="650" r="95" fill="url(#focalInfiltrate)" opacity="0.75" />
    <ellipse cx="520" cy="720" rx="100" ry="90" fill="url(#focalInfiltrate)" opacity="0.65" />
  </g>

  <!-- Technical Radiological Overlay Annotations -->
  <text x="40" y="60" fill="#ffffff" opacity="0.5" font-family="monospace" font-size="20" font-weight="600">PA CHEST ERECT</text>
  <text x="40" y="90" fill="#ffffff" opacity="0.35" font-family="monospace" font-size="14">KV: 125 | mAs: 3.2</text>
  <text x="960" y="60" fill="#F97316" opacity="0.8" font-family="monospace" font-size="24" font-weight="bold" text-anchor="end">R</text>
  <text x="960" y="990" fill="#ffffff" opacity="0.3" font-family="monospace" font-size="14" text-anchor="end">LumiVue Diagnostic Ground Truth</text>
  <text x="40" y="990" fill="#ffffff" opacity="0.3" font-family="monospace" font-size="14">DICOM UID: 1.2.840.113619.2.55</text>
</svg>
